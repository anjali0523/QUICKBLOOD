{% extends 'base.html' %}

{% block title %}Login | QUICKBLOOD{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="glass-card" style="padding: 2.5rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-drop-icon" style="width: 50px; height: 50px; margin: 0 auto 1rem auto;">
                <i class="fas fa-droplet" style="font-size: 1.4rem;"></i>
            </div>
            <h2 style="font-size: 1.8rem; margin-bottom: 0.3rem;">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Log in to manage your donor profile & requests</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Email Address:</label>
                <input type="email" name="email" class="form-control" placeholder="yourname@example.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fas fa-key"></i> Password:</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                <i class="fas fa-right-to-bracket"></i> Login to QUICKBLOOD
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px solid var(--border-glass); font-size: 0.9rem; color: var(--text-secondary);">
            Don't have an account yet? 
            <a href="{{ url_for('register') }}" style="color: var(--accent-red); font-weight: 600;">Register Here</a>
        </div>
    </div>
</div>
{% endblock %}
